<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Endless Field</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 3c6 6 7 14 0 26C9 17 10 9 16 3z%27 fill=%27%23e8573a%27/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="loading">
      <div class="ld-title">Endless Field</div>
      <div class="ld-bar"><span></span></div>
      <div class="ld-stage">waking the wind…</div>
    </div>
    <div id="hud">
      <div id="title">
        <h1>Endless Field</h1>
        <p class="sub">a swallow on the wind</p>
        <p class="hint" id="start-hint">press space or click to begin</p>
      </div>
      <div id="controls"></div>
      <div id="petals"></div>
      <div id="stats"></div>
      <div id="error" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
